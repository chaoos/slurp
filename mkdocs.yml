# The documentation site (GitHub Pages): mkdocs build --strict, or mkdocs serve to read it while writing.
# Built and deployed by .github/workflows/docs.yml.
site_name: slurp
site_description: All of slurm in one slurp. A Textual interface for Slurm jobs, their files and the nodes they run on.
site_url: https://chaoos.github.io/slurp/
repo_url: https://github.com/chaoos/slurp
repo_name: chaoos/slurp
edit_uri: edit/main/docs/
copyright: GPL-3.0

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  icon:
    repo: fontawesome/brands/github
  font: false # (no fonts from Google: the system's)
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Automatic mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Install and start: install.md
  - Using slurp:
      - The overview: guide/overview.md
      - The job list: guide/job-list.md
      - The job window: guide/job-window.md
      - Files and node tools: guide/files.md
      - Tabs and subtabs: guide/tabs.md
      - Clusters over SSH: guide/ssh.md
      - Checks and the rule catalogue: guide/checks.md
      - Quota and scratch: guide/storage.md
      - Copying: guide/copying.md
      - Settings: guide/settings.md
      - Keyboard and mouse: guide/keyboard.md
  - From your own machine:
      - Shells and drives: remote/links.md
      - The slurp helper: remote/helper.md
      - One slurp, several views: remote/web-access.md
      - Browser access: remote/browser.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true # (a missing file fails the build)

validation: # (with --strict, each of these fails the build)
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
