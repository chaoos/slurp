# pre-commit install: these run on the changed files before each commit (pre-commit run --all-files: on all of them)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/images/   # made by tools/make_logo_files.py and tools/make_screenshots.py
      - id: end-of-file-fixer
        exclude: ^docs/images/   # (the same)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
