<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Slurm TUI file and shell views</title>
  <desc id="desc">Three panels illustrate Markdown rendering, HDF5 browsing, and a node shell beside the app.</desc>
  <defs><linearGradient id="top" x2="0" y2="1"><stop stop-color="#1c2635"/><stop offset="1" stop-color="#151c28"/></linearGradient></defs>
  <rect width="1100" height="660" rx="22" fill="#0b1018"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="28" width="500" height="422" rx="16" fill="#111923" stroke="#344256"/>
    <path d="M46 28h468a16 16 0 0 1 16 16v43H30V44a16 16 0 0 1 16-16z" fill="url(#top)"/>
    <text x="280" y="61" text-anchor="middle" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">Markdown · README.md</text>
    <rect x="42" y="98" width="120" height="336" rx="7" fill="#151f2b"/>
    <text x="57" y="124" fill="#82aefa" font-size="13" font-weight="700">CONTENTS</text>
    <text x="57" y="153" fill="#c8d4e3" font-size="13">Overview</text><text x="66" y="180" fill="#8da3bc" font-size="12">Install</text><text x="66" y="204" fill="#8da3bc" font-size="12">Job table</text><text x="66" y="228" fill="#8da3bc" font-size="12">Inspect a job</text><text x="57" y="260" fill="#c8d4e3" font-size="13">File viewers</text>
    <text x="184" y="133" fill="#dce7f5" font-size="23" font-weight="700">Inspect jobs where they run</text>
    <text x="184" y="165" fill="#aebdd0" font-size="13">The job view gathers accounting, progress,</text><text x="184" y="185" fill="#aebdd0" font-size="13">output files, and tools for the allocation.</text>
    <rect x="184" y="208" width="310" height="72" rx="8" fill="#172434" stroke="#2c4058"/><text x="201" y="235" fill="#64d5a0" font-size="13" font-weight="700">✓ Progress updates from output</text><text x="201" y="258" fill="#bdcada" font-size="12">65 / 100 iterations completed</text>
    <text x="184" y="316" fill="#e0e9f4" font-size="15" font-weight="700">Relative links</text><text x="184" y="341" fill="#aebdd0" font-size="12">Use the viewer's link navigation to move</text><text x="184" y="360" fill="#aebdd0" font-size="12">through Markdown documents.</text>
    <rect x="184" y="382" width="126" height="28" rx="6" fill="#214e7e"/><text x="247" y="401" text-anchor="middle" fill="#e5f1ff" font-size="12" font-weight="700">r · Reload</text>

    <rect x="550" y="28" width="520" height="422" rx="16" fill="#111923" stroke="#344256"/>
    <path d="M566 28h488a16 16 0 0 1 16 16v43H550V44a16 16 0 0 1 16-16z" fill="url(#top)"/>
    <text x="810" y="61" text-anchor="middle" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">HDF5 · ensemble.h5</text>
    <rect x="568" y="101" width="160" height="333" rx="7" fill="#151f2b" stroke="#26364a"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#b9c8da"><text x="583" y="128">▾ /</text><text x="601" y="153">▾ configurations</text><text x="620" y="178" fill="#7daef2">● 000042</text><text x="620" y="202">● 000043</text><text x="601" y="235">▸ correlators</text><text x="601" y="262">▸ metadata</text></g>
    <rect x="744" y="101" width="308" height="135" rx="7" fill="#151f2b" stroke="#26364a"/>
    <text x="761" y="128" fill="#80aef2" font-size="12" font-weight="700">DATASET DETAILS</text><text x="761" y="153" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Shape     (128, 4)</text><text x="761" y="176" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Type      float64</text><text x="761" y="199" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Chunking  (16, 4)</text>
    <rect x="744" y="249" width="308" height="185" rx="7" fill="#151f2b" stroke="#26364a"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11"><text x="760" y="274" fill="#8da3bc">ROW</text><text x="830" y="274" fill="#8da3bc">FIELD 0</text><text x="925" y="274" fill="#8da3bc">FIELD 1</text><path d="M758 283h277" stroke="#33445a"/><text x="760" y="304" fill="#b9c8da">0</text><text x="830" y="304" fill="#dce7f5">0.128</text><text x="925" y="304" fill="#dce7f5">0.091</text><text x="760" y="329" fill="#b9c8da">1</text><text x="830" y="329" fill="#dce7f5">0.132</text><text x="925" y="329" fill="#dce7f5">0.088</text><text x="760" y="354" fill="#b9c8da">2</text><text x="830" y="354" fill="#dce7f5">0.127</text><text x="925" y="354" fill="#dce7f5">0.093</text></g>

    <rect x="30" y="470" width="1040" height="160" rx="16" fill="#111923" stroke="#344256"/>
    <path d="M46 470h1008a16 16 0 0 1 16 16v39H30v-39a16 16 0 0 1 16-16z" fill="url(#top)"/>
    <text x="550" y="503" text-anchor="middle" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">Job details · browse on the left while the node shell stays open on the right</text>
    <rect x="51" y="540" width="566" height="68" rx="8" fill="#141e2a"/>
    <text x="70" y="562" fill="#75aaf4" font-size="12" font-weight="700">FILES / JOB ACTIONS / PROGRESS</text><text x="70" y="586" fill="#b9c8da" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Cancel · Restart · stdout · inputs · core dumps</text>
    <rect x="632" y="540" width="417" height="68" rx="8" fill="#091018" stroke="#2b394b"/>
    <text x="651" y="562" fill="#65d19d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">user@login:~$ srun --pty bash -l</text><text x="651" y="586" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">[node]$ nvidia-smi</text>
  <text x="550" y="648" text-anchor="middle" fill="#70839a" font-size="13">Illustrative interface preview · sample content</text>
  </g>
</svg>
