<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Slurm TUI job list</title>
  <desc id="desc">A terminal-style job table with account controls, a completed-job time filter, progress bars, and job states.</desc>
  <defs>
    <linearGradient id="top" x2="0" y2="1"><stop stop-color="#1c2635"/><stop offset="1" stop-color="#151c28"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1100" height="590" rx="22" fill="#0b1018"/>
  <rect x="30" y="28" width="1040" height="534" rx="16" fill="#111923" stroke="#344256" filter="url(#shadow)"/>
  <path d="M46 28h1008a16 16 0 0 1 16 16v45H30V44a16 16 0 0 1 16-16z" fill="url(#top)"/>
  <circle cx="58" cy="55" r="6" fill="#ff6b6b"/><circle cx="80" cy="55" r="6" fill="#f3bd4f"/><circle cx="102" cy="55" r="6" fill="#52c878"/>
  <text x="550" y="62" text-anchor="middle" fill="#dce7f5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">slurm_tui · Jobs</text>
  <text x="55" y="119" fill="#91a3ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">My jobs</text>
  <rect x="131" y="98" width="28" height="16" rx="8" fill="#2d8a78"/><circle cx="150" cy="106" r="6" fill="#e8fff8"/>
  <text x="176" y="119" fill="#91a3ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">All my accounts</text>
  <rect x="302" y="94" width="168" height="31" rx="7" fill="#1c2939" stroke="#44566f"/>
  <text x="316" y="115" fill="#d9e5f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">Completed: 1d</text>
  <text x="1045" y="116" text-anchor="end" fill="#8ca0b9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">r reload · / filter · q quit</text>
  <rect x="51" y="145" width="998" height="38" rx="6" fill="#1a2635"/>
  <g fill="#8fa6c1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">
    <text x="66" y="169">JOB ID</text><text x="160" y="169">NAME</text><text x="365" y="169">USER</text><text x="450" y="169">STATE</text><text x="570" y="169">PROGRESS</text><text x="755" y="169">NODES</text><text x="835" y="169">ELAPSED / LIMIT</text><text x="1005" y="169">ERR</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
    <rect x="51" y="188" width="998" height="63" fill="#121d29"/>
    <text x="66" y="216" fill="#e1eaf5">482731</text><text x="160" y="216" fill="#e1eaf5">prod_ensemble</text><text x="365" y="216" fill="#bbc9da">roman</text><text x="450" y="216" fill="#60d6a1">RUNNING</text>
    <rect x="570" y="205" width="144" height="12" rx="6" fill="#293647"/><rect x="570" y="205" width="94" height="12" rx="6" fill="#57c99b"/><text x="721" y="216" fill="#b6c5d8">65%</text>
    <text x="755" y="216" fill="#b6c5d8">2</text><text x="835" y="216" fill="#b6c5d8">02:13 / 12:00</text><text x="1005" y="216" fill="#687b91">—</text>
    <rect x="51" y="252" width="998" height="63" fill="#101923"/>
    <text x="66" y="280" fill="#e1eaf5">482729</text><text x="160" y="280" fill="#e1eaf5">measure_batch</text><text x="365" y="280" fill="#bbc9da">roman</text><text x="450" y="280" fill="#68a8ff">PENDING</text><text x="570" y="280" fill="#65788f">—</text><text x="755" y="280" fill="#b6c5d8">1</text><text x="835" y="280" fill="#b6c5d8">— / 08:00</text><text x="1005" y="280" fill="#687b91">—</text>
    <rect x="51" y="316" width="998" height="63" fill="#121d29"/>
    <text x="66" y="344" fill="#e1eaf5">482701</text><text x="160" y="344" fill="#e1eaf5">fit_parameters</text><text x="365" y="344" fill="#bbc9da">roman</text><text x="450" y="344" fill="#aab7c8">COMPLETED</text>
    <rect x="570" y="333" width="144" height="12" rx="6" fill="#293647"/><rect x="570" y="333" width="144" height="12" rx="6" fill="#648fe8"/><text x="721" y="344" fill="#b6c5d8">100%</text>
    <text x="755" y="344" fill="#b6c5d8">1</text><text x="835" y="344" fill="#b6c5d8">00:42 / 02:00</text><text x="1005" y="344" fill="#687b91">—</text>
    <rect x="51" y="380" width="998" height="63" fill="#101923"/>
    <text x="66" y="408" fill="#e1eaf5">482698</text><text x="160" y="408" fill="#e1eaf5">solver_array</text><text x="365" y="408" fill="#bbc9da">roman</text><text x="450" y="408" fill="#ff7f83">FAILED</text>
    <rect x="570" y="397" width="144" height="12" rx="6" fill="#293647"/><text x="721" y="408" fill="#b6c5d8">0%</text>
    <text x="755" y="408" fill="#b6c5d8">1</text><text x="835" y="408" fill="#b6c5d8">00:03 / 02:00</text><text x="1005" y="408" fill="#ff6b6b" font-size="20">!</text>
  </g>
  <path d="M52 458h996" stroke="#293647"/>
  <text x="57" y="493" fill="#94a8c0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">Select a row to inspect accounting, output, inputs, progress, memory, and job actions.</text>
  <text x="550" y="536" text-anchor="middle" fill="#70839a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Illustrative interface preview · sample job data</text>
</svg>
