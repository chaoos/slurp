# SDSC Expanse (San Diego): CPU nodes (128 AMD EPYC 7742 cores, 256 GB), GPU nodes (4 NVIDIA V100 32 GB SXM2, 40 Xeon
# 6248 cores), 4 large-memory nodes (2 TB), and the Expanse AI resource (4 NVIDIA H100 per node, nairr-gpu partitions).
# Logins: login.expanse.sdsc.edu (login01-expanse, login02-expanse).
schema = 1
version = "2026.11.23"
name = "SDSC Expanse"
scheduler = "slurm"
match = ["expanse*", "*.expanse.sdsc.edu", "login0?-expanse*"]
docs = "https://www.sdsc.edu/systems/expanse/user_guide.html"
status = "https://www.sdsc.edu/support/data_center_status.html"
scratch_purge_days = 90 # (/expanse/lustre/scratch: files are purged 90 days from creation date)
parallel_fs = ["/expanse/lustre"]
login_node_limits = "No numeric limit is documented: no computationally intensive processes on the login nodes; hosts connecting by SSH more than ten times per minute may be blocked for a short time"

# How to log in (https://www.sdsc.edu/systems/expanse/user_guide.html): ssh with your ACCESS password or an SSH key,
# then always a TOTP code (2FA is required).
[login]
required = ["user"]
user_label = "your Expanse username"
setup = """Once, before the first login:
1. Enroll in 2FA at https://passive.sdsc.edu: ACCESS users choose "Login using Globus" with "ACCESS CI" as the
   organization (not your home institution); others choose "I have an invitation" (ask consult@sdsc.edu). Click
   "Manage 2FA" and scan the QR code with a TOTP app (Google Authenticator, DUO Mobile, ...). It may take up to 15
   minutes to take effect.
2. Optional, to log in with a key: create a key pair on your own machine with a strong passphrase (RSA, ECDSA or
   ed25519), then append its PUBLIC key (the .pub file) to ~/.ssh/authorized_keys on Expanse.
Then each login: enter your password (your ACCESS password for ACCESS users) or use your key from ssh-agent, then the
TOTP code."""

[[clusters]]
name = "expanse"
title = "Expanse"
host = "login.expanse.sdsc.edu"
