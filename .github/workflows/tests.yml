name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not lab"

  lab:
    name: lab (fake Slurm over SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLURP_REQUIRE_LAB: "1" # a missing sshd is an error here, not a skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # (the UI scenario uses asyncio.eager_task_factory: 3.12+)
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: OpenSSH and sshfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client sshfs
          sudo mkdir -p /run/sshd
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m lab -v --basetemp="$RUNNER_TEMP/pytest"
      - name: Keep the scenario output (logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-output
          path: ${{ runner.temp }}/pytest/lab*/out/
          if-no-files-found: ignore
          retention-days: 14
