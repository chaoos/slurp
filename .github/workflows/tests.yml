name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit and ui (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest tests/unit tests/ui

  lab:
    name: e2e (slurp against a fake Slurm over SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLURP_REQUIRE_LAB: "1" # a missing sshd is an error here, not a skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # (the UI scenario uses asyncio.eager_task_factory: 3.12+)
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: OpenSSH and sshfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client sshfs
          sudo mkdir -p /run/sshd
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest tests/e2e -v --basetemp="$RUNNER_TEMP/pytest"
      - name: Keep the output of the e2e tests (logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: ${{ runner.temp }}/pytest/lab*/out/
          if-no-files-found: ignore
          retention-days: 14
