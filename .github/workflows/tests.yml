name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit and ui (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest tests/unit tests/ui

  lab:
    name: e2e (slurp against a fake Slurm over SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLURP_REQUIRE_LAB: "1" # a missing sshd is an error here, not a skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # (the UI scenario uses asyncio.eager_task_factory: 3.12+)
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: OpenSSH and sshfs
        run: |
          # (retries: a mirror that did not answer once failed the whole job before any test)
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends openssh-server openssh-client sshfs
          sudo mkdir -p /run/sshd
      - name: rclone (the transfers to S3 and WebDAV; here and on the lab, the same machine)
        run: |
          v=1.76.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://downloads.rclone.org/v$v/rclone-v$v-linux-amd64.zip"
          echo "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7  rclone-v$v-linux-amd64.zip" | sha256sum -c -
          unzip -q "rclone-v$v-linux-amd64.zip"
          sudo install -m 755 "rclone-v$v-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest tests/e2e -v --basetemp="$RUNNER_TEMP/pytest"
      - name: Keep the output of the e2e tests (logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: ${{ runner.temp }}/pytest/lab*/out/
          if-no-files-found: ignore
          retention-days: 14
