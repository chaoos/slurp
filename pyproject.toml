[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slurp"
description = "All of slurm in one slurp: a terminal and browser UI for Slurm jobs, locally or on clusters over SSH"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Roman Gruber" }]
keywords = ["slurm", "hpc", "tui", "textual", "ssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Clustering",
]
# Not from pip: ssh, the Slurm commands (here or on the cluster you connect to), and sshfs/fusermount for mounting
# drives on this machine.
dependencies = [
    "humanize",
    "python-dateutil",  # durations of the finished-jobs window (2w, 1mo, ...)
    "pyte",             # the terminal emulator of the shells
    "rich",
    "textual[syntax]",  # with syntax highlighting in the script editor (tree-sitter)
]

[project.optional-dependencies]
links = ["asyncssh"]                    # shells and drives from your own terminal
hdf5 = ["h5py", "numpy"]                # the HDF5 view; without it slurp shows `h5dump -H`
web = ["textual-serve", "textual-web"]  # slurp --serve, and a public link to the app
all = ["slurp[links,hdf5,web]"]
dev = ["pytest>=8", "ruff", "pre-commit"]  # with all: pip install -e ".[all,dev]"

[project.scripts]
slurp = "slurp.cli:main"

[project.urls]
Homepage = "https://github.com/chaoos/slurp"
Source = "https://github.com/chaoos/slurp"
Documentation = "https://github.com/chaoos/slurp/blob/main/docs/manual.md"
Changelog = "https://github.com/chaoos/slurp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/slurp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slurp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "tools", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/ui", "tests/e2e"] # (in this order: the quick ones first)
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    # the e2e tests start ssh, sshfs and slurp in pseudo terminals from pytest's process, which has threads: the child
    # execs at once, which is the safe case of fork in a threaded process
    "ignore:This process .* is multi-threaded, use of forkpty\\(\\) may lead to deadlocks:DeprecationWarning",
]
markers = [
    "lab: needs the lab (a local sshd with a fake Slurm, tests/e2e/lab); every test in tests/e2e has it. Skipped without sshd unless SLURP_REQUIRE_LAB=1",
]

[tool.ruff]
target-version = "py311"
indent-width = 2     # slurp's style; ruff check only, no formatter (it would rewrite the compact one-line forms)
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]
ignore = [
    "E701", "E702",  # one-line bodies (`try: x`) and `a; b`: the compact style of the code
    "E731",          # small lambdas bound to a name
    "E741",          # l and I as names
]
